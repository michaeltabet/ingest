# $schema: https://raw.githubusercontent.com/knative/func/0f56a5de/schema/func_yaml-schema.json
# yaml-language-server: $schema=https://raw.githubusercontent.com/knative/func/0f56a5de/schema/func_yaml-schema.json
specVersion: 0.36.0
name: ingest-worker-http
runtime: python
registry: registry.registry.svc:5000/ingest
registryInsecure: true
namespace: ingest
deployer: knative
created: 2026-08-23T00:00:00Z
build:
  builder: pack
run:
  volumes:
  - configMap: ingest-pipelines
    path: /etc/ingest-pipelines
  - configMap: ingest-pipelines-overlay-cluster
    path: /etc/ingest-pipelines/overlays/cluster
  envs:
  - name: WORKER_QUEUE
    value: scrape-http
  - name: TEMPORAL_TARGET
    value: temporal-frontend.data.svc:7233
  - name: TEMPORAL_NAMESPACE
    value: ingest
  - name: INGEST_DOMAIN
    value: jobs
  - name: INGEST_OVERLAY
    value: cluster
  - name: INGEST_PIPELINES
    value: /etc/ingest-pipelines
  - name: CH_HOST
    value: clickhouse.data.svc
  - name: CH_PORT
    value: "8123"
  - name: CH_DATABASE
    value: ingest
deploy:
  namespace: ingest
  options:
    scale:
      min: 1
      max: 1
  deployer: knative
