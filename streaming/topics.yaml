# Kafka topics as reviewed config (not clicked into existence).
# Applied to the existing cluster Kafka in build-order step 7.
topics:
  - name: temporal.visibility.public.executions_visibility
    partitions: 3
    replication: 1
    retention_ms: 604800000   # 7d — CDC stream; ClickHouse is the store of record
sinks:
  # Kafka -> ClickHouse temporal_meta. See sinks/clickhouse-sink.yaml
  - topic: temporal.visibility.public.executions_visibility
    table: temporal_meta
