[project]
name = "ingest"
version = "0.1.0"
description = "HiredSignal job-board scraper / ingest (Python)"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "clickhouse-connect>=0.7",
    "temporalio>=1.6",
    "django>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
